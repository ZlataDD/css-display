<!DOCTYPE html>
<html>

<head>
  <title>CSS Display</title>
  <style>
    p {
      color: white;
    }

    .red {
      display: inline-block;
      width: 200px;
      height: 200px;
      background-color: red;
    }

    .green {
      display: inline-block;
      width: 200px;
      height: 200px;
      background-color: green;
    }

    .blue {
      display: inline-block;
      width: 200px;
      height: 200px;
      background-color: blue;
    }

    p {
      color: white;
    }

    .red1 {
      display: block;
      width: 200px;
      height: 200px;
      background-color: red;
    }

    .green1 {
      display: block;
      width: 200px;
      height: 200px;
      background-color: green;
    }

    .blue1 {
      display: block;
      width: 200px;
      height: 200px;
      background-color: blue;
    }
 
    p {
      color: white;
    }

    .red2 {
      display: inline;
      width: 200px;
      height: 200px;
      background-color: red;
    }

    .green2 {
      display: inline;
      width: 200px;
      height: 200px;
      background-color: green;
    }

    .blue2 {
      display: inline;
      width: 200px;
      height: 200px;
      background-color: blue;
    }
  </style>
</head>

<body>
  <h1>CSS Display inline-block</h1>
  <p class="red">Red Paragraph </p>
  <p class="green">Green Paragraph</p>
  <p class="blue">Blue Paragraph</p>

  <h1>CSS Display block</h1>
  <p class="red1">Red Paragraph </p>
  <p class="green1">Green Paragraph</p>
  <p class="blue1">Blue Paragraph</p>

  <h1>CSS Display inline</h1>
  <p class="red2">Red Paragraph </p>
  <p class="green2">Green Paragraph</p>
  <p class="blue2">Blue Paragraph</p>

</body>

</html>
